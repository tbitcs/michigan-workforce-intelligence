name: ${COMPOSE_PROJECT_NAME:-michigan-workforce-intelligence}

x-runtime: &runtime
  image: ${COMPOSE_PROJECT_NAME:-michigan-workforce-intelligence}:local
  build:
    context: .
    target: runtime
  env_file: .env
  volumes:
    - evidence:/data
  init: true
  security_opt:
    - no-new-privileges:true

services:
  app:
    <<: *runtime
    ports:
      - "127.0.0.1:${MIJOBS_MCP_PORT:-8000}:${MIJOBS_MCP_PORT:-8000}"
    networks:
      default:
        aliases: [workforce-mcp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "mijobs.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  exchange:
    image: ${COMPOSE_PROJECT_NAME:-michigan-workforce-intelligence}:local
    build:
      context: .
      target: runtime
    command: [python, -m, mijobs.exchange.app]
    environment:
      EXCHANGE_DATABASE: /confidential/exchange.sqlite3
      EXCHANGE_ENCRYPTION_KEY: ${EXCHANGE_ENCRYPTION_KEY:-}
      EXCHANGE_OPERATOR_TOKEN: ${EXCHANGE_OPERATOR_TOKEN:-}
      EXCHANGE_PORT: ${EXCHANGE_PORT:-8085}
    volumes:
      - confidential:/confidential
    ports:
      - "127.0.0.1:${EXCHANGE_PORT:-8085}:${EXCHANGE_PORT:-8085}"
    networks: [confidential]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('EXCHANGE_PORT', '8085') + '/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4

  cli:
    <<: *runtime
    profiles: [tools]
    entrypoint: [mijobs]
    command: [--help]

  ci:
    image: ${COMPOSE_PROJECT_NAME:-michigan-workforce-intelligence}:ci
    build:
      context: .
      target: ci
    profiles: [tools]
    init: true
    environment:
      STRICT_TOOLS: "1"
      MIJOBS_DATABASE_URL: sqlite:////tmp/ci.db
      MIJOBS_ARTIFACT_ROOT: /tmp/artifacts

  tui:
    image: ${COMPOSE_PROJECT_NAME:-michigan-workforce-intelligence}:manager
    build:
      context: .
      target: manager
    profiles: [tools]
    init: true
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  evidence:
  confidential:

networks:
  confidential:
    driver: bridge
  default:
    name: ${MIJOBS_NETWORK_NAME:-michigan-workforce}
