[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "michigan-workforce-intelligence"
version = "0.1.0"
description = "Epistemic, hash-chained workforce intelligence platform for Michigan"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
mijobs = "mijobs.cli:app"
mijobs-mcp = "mijobs.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mijobs"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mijobs"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
